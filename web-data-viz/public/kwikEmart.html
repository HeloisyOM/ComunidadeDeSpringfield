<html lang="en">

    <link rel="stylesheet" href="./css/kwik.css">

    <script src="js/sessao.js"></script>

</head>

<body onload="validar()">

    <main>
        <div id="div_navbarTop">
            <div id="conteudo_nav">

                <div class="opcao menu">

                        Dashboard
                    </a>
                </div>
                <div class="opcao menu">

                    </a>
                </div>
            </div>
        </div>
        <div id="img_kwik">
        </div>
        <div id="conteudoCentral">
        
        <div id="vendinha">
        <div class="produtos">

            <div class="produto">
                
                <img src="../assets/produtos/rosquinha.png" alt="Rosquinha" class="img-prod">

                <input type="number" id="input_qntRosq">

            </div>

            <div class="produto">
           
                <img src="../assets/produtos/duff.png" alt="Cerveja Duff" class="img-prod">
                <label for="input_qntDuff">Quantidade:</label>
                <input type="number" id="input_qntDuff">
                <img src="./assets/produtos/6.png" alt="promo Duff">

            </div>
            <div class="produto">

                <img src="./assets/produtos/panqueca.png" alt="Panqueca" class="img-prod">
                <label for="input_qntPanq">Quantidade:</label>
                <input type="number" id="input_qntPanq">
                <img src="./assets/produtos/7.png" alt="promo Panq">

            </div>
            <div class="produto">

                <img src="./assets/produtos/pizza.png" alt="Pizza do Luigi" class="img-prod">
                <label for="input_qntPizz">Quantidade:</label>
                <input type="number" id="input_qntPizz">
                <img src="./assets/produtos/8.png" alt="promo Pizz">

            </div>
        </div>
        <div class="produtos">
            <div class="produto">

                <img src="./assets/produtos/buzzCOla.png" alt="Buzz Cola" class="img-prod">
                <label for="input_qntBuzz">Quantidade:</label>
                <input type="number" id="input_qntBuzz">
                <img src="./assets/produtos/9.png" alt="promo Buzz">

            </div>
            <div class="produto">

                <img src="./assets/produtos/taco.png" alt="Taco" class="img-prod">
                <label for="input_qntTaco">Quantidade:</label>
                <input type="number" id="input_qntTaco">
                <img src="./assets/produtos/10.png" alt="promo taco">

            </div>
            <div class="produto">
                <img src="./assets/produtos/hamburger.png" alt="Hamburguer" class="img-prod">
                <label for="input_qntBurg">Quantidade:</label>
                <input type="number" id="input_qntBurg">
                <img src="./assets/produtos/11.png" alt="promo Hamburguer">

            </div>
            <div class="produto">
                <img src="./assets/produtos/hotDog.png" alt="Hot Dog do Homer" class="img-prod">
                <label for="input_qntHot">Quantidade:</label>
                <input type="number" id="input_qntHot">
                <img src="./assets/produtos/12.png" alt="promo Hot dog">

            </div>
        </div>
        </div>
        <div id="img_apu">
                    <button onclick="comprar()">Comprar</button>

            <!-- style="display: none;" -->
            <div id="alerta"  ></div>
            <img src="./assets/imgs/apu_kwik.png" alt=""></div>
        </div> 
    </main>
</body>

</html>

<script>

    var idUsuario = "";
    function validar() {

        idUsuario = sessionStorage.ID_USUARIO;

        if (!idUsuario) {
            alert('Acesso Negado!')
            setTimeout(() => {
                window.location = "login.html";
            }, "2000");
        }
    }
    function comprar() {
        var qntRosq = input_qntRosq.value;
        var qntDuff = input_qntDuff.value;
        var qntPanq = input_qntPanq.value;
        var qntPizz = input_qntPizz.value;
        var qntBuzz = input_qntBuzz.value;
        var qntTaco = input_qntTaco.value;
        var qntBurg = input_qntBurg.value;
        var qntHot = input_qntHot.value;

        var total = (qntRosq * 6) + (qntDuff * 12) + (qntPanq * 15) + (qntPizz * 45) + (qntBuzz * 8) + (qntTaco * 10) + (qntBurg * 18) + (qntHot * 14);

        if (!qntRosq) qntRosq = 0;
        if (!qntDuff) qntDuff = 0;
        if (!qntPanq) qntPanq = 0;
        if (!qntPizz) qntPizz = 0;
        if (!qntBuzz) qntBuzz = 0;
        if (!qntTaco) qntTaco = 0;
        if (!qntBurg) qntBurg = 0;
        if (!qntHot) qntHot = 0;


        fetch("/mercado/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({

                totalServer: total,
                rosqServer: qntRosq,
                duffServer: qntDuff,
                panqServer: qntPanq,
                pizzServer: qntPizz,
                buzzServer: qntBuzz,
                tacoServer: qntTaco,
                burgServer: qntBurg,
                hotServer: qntHot,
                idUserServer: idUsuario

            }),
        }).then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                alerta.style.display='block';

                if (total <= 20) {
                    alerta.innerHTML = `Gastou pouco, hein? O Homer tá orgulhoso… menos uma dívida pra família Simpson!`;
                } else if (total > 20 && total <= 40) {
                    alerta.innerHTML = `Compra modesta! A Marge agradece por você não destruir o orçamento familiar.`;
                } else if (total > 40 && total <= 70) {
                    alerta.innerHTML = `Hmm… tá começando a gastar como alguém que foi seduzido por rosquinhas. O Homer aprova!`;
                } else if (total > 70 && total <= 100) {
                    alerta.innerHTML = `Isso aí já parece um jantar completo no Kwik-E-Mart. O Apu agradece a preferência!`;
                } else if (total > 100 && total <= 150) {
                    alerta.innerHTML = `Você gastou o suficiente pra financiar metade do bar do Moe por um dia inteiro.Certeza que tem Duff envolvida!`;
                } else if (total > 150 && total <= 200) {
                    alerta.innerHTML = `Acho que você acabou de virar cliente VIP do Apu. Ele provavelmente já sabe seu nome e onde você mora.`;
                } else {
                    alerta.innerHTML = `Meu deus até o Sr. Burns olharia pra você e diria: ‘Excelente…`;
                }

            } else {
                throw "Houve um erro ao tentar realizara compra";
            }
        })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
        return false;
    }



</script>
