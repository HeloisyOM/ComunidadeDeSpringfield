<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 

  var idUsuarioAtual =0;

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var personagem = select_personagem.value;
    var lugarFavorito = select_lugar.value;
    var nome = input_nome.value;
    var dtNasc = input_dtNasc.value;
    var genero = select_genero.value;
    var email = input_email.value;
    var senha = input_senha.value;
    var confirmacaoSenha = input_confirmacao.value;

    // Verificando se há algum campo em branco
    if (
      nome == "" ||
      email == "" ||
      senha == "" ||
      confirmacaoSenha == "" 
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } 
   else {
      setInterval(sumirMensagem, 5000);
    }

    /* // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    } */

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        personagemServer : personagem,
        lugarfavServer : lugarFavorito,
        nomeServer: nome,
        dtnascServer: dtNasc,
        generoServer : genero,
        emailServer: email,
        senhaServer: senha,
      }),
    })
      .then(function (resposta) {
      console.log("resposta: ", resposta);

       if (!resposta.ok) {
        throw "Houve um erro ao tentar realizar o cadastro!";
       }
       else{
         return resposta.json(); /*retorna em json o que foi mandado no controller para poder armazenar o id*/
       }
      
    })
      .then(json => {
        idUsuarioAtual = json.insertId; /*Armazena o últido id inserido*/
        console.log("ID do usuário cadastrado:", idUsuarioAtual) /*mostra no console*/

          cadastro_p2.style.display = "block";
          cadastro_p1.style.display = "none";
          cardErro.style.display = "block";

          limparFormulario();
          finalizarAguardar();
         
        })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  /* // Listando empresas cadastradas 
  function listar() {

      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }
 */

 function cadastrarMensagem(){

    var mensagem = txtArea_msg.value
      fetch("/mensagem/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
       
        msgServer:mensagem,
        idUsuario: idUsuarioAtual
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
         
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          cardErro.style.display = "block";

      /* finalizarAguardar();*/
         } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });
    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
