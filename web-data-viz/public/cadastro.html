<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 

  var idUsuarioAtual = 0;

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nome = input_nome.value;
    var genero = select_genero.value;
    var dtNasc = input_dtNasc.value;
    var personagem = select_personagem.value;
    var lugarFavorito = select_lugar.value;
    var email = input_email.value;
    var senha = input_senha.value;
    var confirmacaoSenha = input_confirmacao.value;

    // Verificando se há algum campo em branco
    if (nome == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "O nome está em branco!";
      finalizarAguardar();
      return false;
    } else if (genero == '#') {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Informe o seu gênero!";
      finalizarAguardar();
      return false;
    } else if (dtNasc == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Informe a sua data de nascimento!";
      finalizarAguardar();
      return false;
    } else if (personagem == '#') {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Escolha o seu personagem favorito!";
      finalizarAguardar();
      return false;
    } else if (lugarFavorito == '#') {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Escolha o seu lugar favorito!";
      finalizarAguardar();
      return false;
    } else if (!email.includes('@')) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "O e-mail não tem '@'!";
      finalizarAguardar();
      return false;
    } else if (email == '@') {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "E-mail inválido!";
      finalizarAguardar();
      return false;
    } else if (senha.length > 40) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha pode ter até 40 caracteres!";
      finalizarAguardar();
      return false;
    } else if (confirmacaoSenha != senha) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não são iguais! Verifique";
      finalizarAguardar();
      return false;
    }
    else {
      setInterval(sumirMensagem, 3000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        personagemServer: personagem,
        lugarfavServer: lugarFavorito,
        nomeServer: nome,
        dtnascServer: dtNasc,
        generoServer: genero,
        emailServer: email,
        senhaServer: senha,
      }),
    }).then(function (resposta) {
      console.log("resposta: ", resposta);

      if (resposta.ok) {
          resposta.json().then(function (resposta) {
          idUsuarioAtual = resposta.insertId;
          console.log("ID do usuário cadastrado:", idUsuarioAtual)

          cadastro_p3.style.display = "block";
          cadastro_p2.style.display = "none";
          cadastro_p1.style.display = "none";
          cardErro.style.display = "block";

          finalizarAguardar();
        })
      } else {
        throw "Houve um erro ao tentar realizar o cadastro!";
      }
    })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });
    return false;
  }

  /* .then(function (resposta) {
    console.log("resposta: ", resposta);

    if (!resposta.ok) {
      throw "Houve um erro ao tentar realizar o cadastro!";

    else {
      return resposta.json();

  function cadastrarMensagem() {

    var mensagem = txtArea_msg.value

    if (mensagem == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Responda a pergunta!";
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 3000);


      fetch("/mensagem/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({

          msgServer: mensagem,
          idUsuario: idUsuarioAtual
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {

            mensagem_erro.innerHTML =
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

            cardErro.style.display = "block";

            /* finalizarAguardar();*/
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });
      return false;
    }
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
