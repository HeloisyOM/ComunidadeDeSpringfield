<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>
    <canvas id="graficoTop3"></canvas>

<script>
    window.onload = obterDadosTop3;
    function obterDadosTop3() {

        fetch(`/personagem/top3`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log("Top 3 recebido:", resposta);
                    plotarGraficoTop3(resposta);
                });
            } else {
                console.error("Nenhum dado encontrado para o Top 3!");
            }
        })
            .catch(function (error) {
                console.error(`Erro no fetch do top3`);
            });
    }

    
    function plotarGraficoTop3(resposta) {

        console.log('plotando top3 no gráfico');
        
        var nomePersonagem = [];
        var valores = []

        // Criando estrutura para plotar gráfico 

        for (var i = 0; i < resposta.length; i++) {
        var dadoAtual = resposta[i];
        nomePersonagem.push(dadoAtual.personagem);
        valores.push(dadoAtual.total);
    }

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: nomePersonagem,
            datasets: [{
                label: 'Personagens mais escolhidos',
                data: valores,
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            },
            
        ]};

        /* console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta) */

        /* // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.umidade);
            dados.datasets[1].data.push(registro.temperatura);
        } */

        /* console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('------------------------------ */

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        new Chart(
            document.getElementById("graficoTop3"),
            config
        );

    }

</script>
